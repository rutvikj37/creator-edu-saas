# Serves the SPA and proxies the API. Production edge config (TLS, wildcard and
# custom domains) is added in Phase 8/11.
# Note: nginx drops server-level add_header directives in any location that declares
# its own add_header, so every location includes the shared security headers.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  location /api/ {
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 2m; # large files go directly to S3 via presigned URLs
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include /etc/nginx/conf.d/security-headers.inc;
    try_files $uri =404;
  }

  location = /sw.js {
    add_header Cache-Control "no-cache" always;
    add_header Service-Worker-Allowed "/" always;
    include /etc/nginx/conf.d/security-headers.inc;
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/conf.d/security-headers.inc;
    try_files $uri /index.html;
  }
}
