# TechX LMS: shared locations for every LMS host (installed as /etc/nginx/snippets/lms-app.conf).
# The SPA is the current release's build; /api goes to the API on 127.0.0.1:4100.
root /opt/lms/current/apps/web/dist;
server_tokens off;
client_max_body_size 2m; # large files go straight to S3 with presigned URLs

location /api/ {
    proxy_pass http://127.0.0.1:4100;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s; # chat long-polls are held for up to 25 s
}

location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include /etc/nginx/snippets/lms-security-headers.conf;
    try_files $uri =404;
}

location = /sw.js {
    add_header Cache-Control "no-cache" always;
    add_header Service-Worker-Allowed "/" always;
    include /etc/nginx/snippets/lms-security-headers.conf;
    try_files $uri =404;
}

location / {
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/snippets/lms-security-headers.conf;
    try_files $uri /index.html;
}
