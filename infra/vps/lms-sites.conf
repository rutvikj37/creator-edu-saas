# TechX LMS: platform hosts (installed as /etc/nginx/sites-enabled/lms.conf).
#   lms.techxsolutions.io       -> platform: agency / client panel (login + forgot password)
#   lmsadmin.techxsolutions.io  -> Super Admin only (opens /login directly; no forgot-password)
#   <slug>.lms.techxsolutions.io and agencies' own domains -> academy sites; one file per address in
#   /etc/nginx/lms-portals/, written by /usr/local/bin/lms-auto-certs once it has a certificate.
# Port 80 (Let's Encrypt checks + redirect to HTTPS) is handled by the server's existing default site.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name lms.techxsolutions.io;
    ssl_certificate /etc/letsencrypt/live/lms.techxsolutions.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lms.techxsolutions.io/privkey.pem;
    include /etc/nginx/snippets/visacrm-ssl.conf;
    include /etc/nginx/snippets/lms-app.conf;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name lmsadmin.techxsolutions.io;
    ssl_certificate /etc/letsencrypt/live/lmsadmin.techxsolutions.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lmsadmin.techxsolutions.io/privkey.pem;
    include /etc/nginx/snippets/visacrm-ssl.conf;
    include /etc/nginx/snippets/lms-app.conf;
}

include /etc/nginx/lms-portals/*.conf;
